<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Vasco Santos" />
    <meta name="description" content="Portfolio of Vasco Santos, a game developer working with Unity, Unreal Engine and GB Studio." />
    <meta property="og:title" content="Vasco Santos - Game Developer" />
    <meta property="og:description" content="Professional experience, personal games and development logs by Vasco Santos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vasco-dev.github.io/" />
    <meta property="og:image" content="https://vasco-dev.github.io/docs/img/pfp.png" />

    <title>Vasco | Game Developer</title>
    <link rel="icon" href="docs/img/pfp.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ekmas/cs16.css@main/css/cs16.min.css" />
    <link rel="stylesheet" href="./docs/styles.css" />
</head>
<body>
    <main class="siteShell">
        <h1>Vasco Santos</h1>
        <fieldset class="cs-tabs siteTabs">
            <legend class="visuallyHidden">Portfolio sections</legend>
            <input class="radiotab" name="portfolio-tabs" type="radio" id="home-tab" checked />
            <label class="label" for="home-tab">HOME</label>
            <section class="panel">
                <div class="profileLayout">
                    <img class="profileImg cs-frame" alt="Vasco Santos" src="./docs/img/pfp.png" width="1600" height="1600" decoding="async" />
                    <div>
                        <h2>CONTACTS</h2>
                        <ul class="contactList">
                            <li><a href="mailto:vascosantos.dev@gmail.com">vascosantos.dev@gmail.com</a></li>
                            <li><a href="https://www.linkedin.com/in/vasco-santos-dev/">LinkedIn</a></li>
                            <li><a href="https://vascosantos.itch.io/">Itch.io</a></li>
                            <li><a href="https://twitter.com/vasco_dev">Twitter</a></li>
                        </ul>
                        <hr class="cs-hr" />
                        <h2>RESUME / CV</h2>
                        <a href="docs/CV-VascoSantos.pdf" class="cs-btn actionButton">OPEN</a>
                    </div>
                </div>
            </section>

            <input class="radiotab" name="portfolio-tabs" type="radio" id="experience-tab" />
            <label class="label" for="experience-tab">EXPERIENCE</label>
            <section class="panel framePanel">
                <iframe class="tabFrame" src="./experience.html" title="Experience and personal projects"></iframe>
            </section>

            <input class="radiotab" name="portfolio-tabs" type="radio" id="logs-tab" />
            <label class="label" for="logs-tab">LOGS</label>
            <section class="panel framePanel">
                <iframe class="tabFrame" src="./logs.html" title="Development logs"></iframe>
            </section>
        </fieldset>
    </main>
</body>
</html>
