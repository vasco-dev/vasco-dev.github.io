<!doctype html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ekmas/cs16.css@main/css/cs16.min.css" />
    <link rel="stylesheet" href="./docs/styles.css" />
    <script src="./docs/tabs.js" defer></script>
</head>
<body>
    <main class="siteShell">
        <h1>Vasco Santos</h1>
        <div class="cs-tabs siteTabs">
            <input class="radiotab" name="portfolio-tabs" tabindex="1" type="radio" id="home-tab" checked />
            <label class="label" for="home-tab">HOME</label>
            <section class="panel" tabindex="0">
                <div class="profileLayout">
                    <img class="profileImg cs-input" alt="Vasco Santos" src="./docs/img/pfp.png" />
                    <div>
                        <h2>CONTACTS</h2>
                        <ul class="contactList">
                            <li><a href="mailto:vascosantos.dev@gmail.com">vascosantos.dev@gmail.com</a></li>
                            <li><a href="https://www.linkedin.com/in/vasco-santos-dev/">LinkedIn</a></li>
                            <li><a href="https://vascosantos.itch.io/">Itch.io</a></li>
                            <li><a href="https://twitter.com/vasco_dev">Twitter</a></li>
                        </ul>
                        <hr class="cs-hr" />
                        <h2>RESUME / CV</h2>
                        <a href="docs/CV-VascoSantos.pdf" class="cs-btn actionButton">OPEN</a>
                    </div>
                </div>
            </section>

            <input class="radiotab" name="portfolio-tabs" tabindex="1" type="radio" id="experience-tab" />
            <label class="label" for="experience-tab">EXPERIENCE</label>
            <section class="panel framePanel" tabindex="0">
                <iframe class="tabFrame" src="./experience.html" title="Experience and personal projects" scrolling="auto"></iframe>
            </section>

            <input class="radiotab" name="portfolio-tabs" tabindex="1" type="radio" id="logs-tab" />
            <label class="label" for="logs-tab">LOGS</label>
            <section class="panel framePanel" tabindex="0">
                <iframe class="tabFrame" src="./logs.html" title="Development logs" scrolling="auto"></iframe>
            </section>
        </div>
    </main>
</body>
</html>
